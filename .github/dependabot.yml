version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # pinned on purpose, a major upgrade needs its own planned change
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # the client major must match the elasticsearch server image (8.x)
      - dependency-name: '@elastic/elasticsearch'
        update-types: ['version-update:semver-major']
      # types follow the oldest node we support (22)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']